# Incus profile for a collab-cluster swarm.
#
# On first boot (via cloud-init) this profile makes a container ready to run a
# swarm component:
#   - installs git and the libtorrent python binding,
#   - clones this repo into /home/debian/collab-cluster-experiment; the
#     systemd --user units set WorkingDirectory to it, so their scripts resolve
#     inside that checkout — except a node's own storage, redirected below to a
#     fixed path outside it,
#   - installs the units into ~/.config/systemd/user/ (you enable the right one
#     per container — see the incus README, step 3),
#   - clones collab-cluster-utils into /home/debian/collab-cluster-utils and
#     installs its data manager and rescuer units, for nodes given a policy or
#     made rescue nodes (README steps 7 and 8).
#
# None of that is swarm configuration, and there is none to do: nodes discover
# each other with a multicast beacon on the container bridge, and the optional
# dashboard reads them through any one of them. So the identical profile applies
# to every container, and nothing here names another container.
#
# Assumptions (edit if they don't hold):
#   - The services run under the image's default `debian` user's `systemd --user`
#     instance (home /home/debian). For a different user, change the paths/owner.
#   - The image has cloud-init (use the images: '/cloud' variants).
#   - The container can reach the git URL below. Point it at your fork/mirror if
#     needed.
#
# security.nesting=true: recent systemd-networkd.service (and similar units) set
# PrivateUsers=yes, which creates a nested user namespace to sandbox itself in —
# blocked by Incus's default AppArmor profile for an unprivileged container, so
# the unit crash-loops forever and the container never gets a DHCP lease.
# Nesting relaxes that profile enough to let it start.
#
# `runcmd` runs in cloud-init's final stage, after the `debian` user exists, so
# the clone/copy see the user's home already in place.
#
# Load:   incus profile create collab-cluster
#         incus profile edit   collab-cluster < incus/collab-cluster.yaml
# Apply:  incus launch <image> <name> --profile default --profile collab-cluster
description: collab-cluster swarm (repo + libtorrent + systemd units, no config)
config:
  security.nesting: "true"
  cloud-init.user-data: |
    #cloud-config
    package_update: true
    packages:
      - git
      - python3-libtorrent
      # Full terminfo database so `incus exec` sessions work with terminals
      # whose TERM (e.g. alacritty, kitty, foot) the base image doesn't ship.
      - ncurses-term
    runcmd:
      - git clone --depth 1 https://github.com/vmx/collab-cluster-experiment.git /home/debian/collab-cluster-experiment
      # Install the systemd --user units (copies both; enable one later).
      - mkdir --parents /home/debian/.config/systemd/user
      - cp /home/debian/collab-cluster-experiment/systemd/collab-cluster-*.service /home/debian/.config/systemd/user/
      # A node stores under NODES_DIR (default: the checkout's nodes/), which a
      # host-path disk device can't target directly — Incus creates the mount
      # point before this runcmd's git clone runs, which would then fail on a
      # non-empty target. This drop-in points storage at a fixed path outside
      # the checkout instead; mount a disk device there per container (see
      # incus/new-container.sh's data-root argument) to put it on a host
      # partition, or leave it unmounted and it's just an ordinary directory
      # in the container.
      - mkdir --parents /home/debian/.config/systemd/user/collab-cluster-node.service.d
      - cp /home/debian/collab-cluster-experiment/incus/collab-cluster-node.service.d/override.conf /home/debian/.config/systemd/user/collab-cluster-node.service.d/
      # /mnt is root's, so create the storage dir for `debian` up front —
      # unless a data-root is already mounted there, which is left untouched.
      - '[ -d /mnt/collab-data ] || install --directory --owner debian --group debian /mnt/collab-data'
      # The optional data manager, which decides what the node in this
      # container holds, and the rescuer, which fills a rescue node instead.
      # Installed everywhere, enabled only where asked for
      # (incus/new-container.sh --policy or --rescue). Standard library only,
      # so they run from the checkout with the system python3.
      - git clone --depth 1 https://github.com/vmx/collab-cluster-utils.git /home/debian/collab-cluster-utils
      - cp /home/debian/collab-cluster-utils/deploy/incus/collab-cluster-data-manager.service /home/debian/.config/systemd/user/
      - cp /home/debian/collab-cluster-utils/deploy/incus/collab-cluster-rescuer.service /home/debian/.config/systemd/user/
      # The clone/copy ran as root, so hand the whole home back to `debian`.
      - chown --recursive debian:debian /home/debian
